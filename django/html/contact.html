{% extends "dashboard/base.html" %}

{% block content %}

<div class="contact-page">

    <!-- HEADER -->
    <div class="contact-header">
        <h2>Contact us</h2>
        <p>Have questions about PrismESG? We'd love to hear from you.</p>
    </div>

    <!-- MAIN SECTION -->
    <div class="contact-container">

        <!-- LEFT: FORM -->
        <div class="contact-form">

            <h5>Send a message</h5>

            <form>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" placeholder="How can we help?">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="Write your message..."></textarea>
                </div>

                <button class="submit-btn">Send message</button>

            </form>

        </div>

        <!-- RIGHT: INFO -->
        <div class="contact-info">

            <h5>Get in touch</h5>

            <div class="info-box">
                <strong>Email</strong>
                <p>hello@prismesg.com</p>
            </div>

            <div class="info-box">
                <strong>Support</strong>
                <p>support@prismesg.com</p>
            </div>

            <div class="info-box">
                <strong>Location</strong>
                <p>Mumbai, India</p>
            </div>

            <div class="info-box">
                <strong>Response time</strong>
                <p>Within 24 hours</p>
            </div>

        </div>

    </div>

</div>

<style>

/* PAGE */
.contact-page{
    padding:40px;
    background:#f8fafc;
    min-height:100vh;
}

/* HEADER */
.contact-header{
    text-align:center;
    margin-bottom:30px;
}

.contact-header h2{
    font-weight:600;
    margin-bottom:8px;
}

.contact-header p{
    color:#64748b;
    font-size:14px;
}

/* CONTAINER */
.contact-container{
    max-width:1100px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 2fr 1fr;
    gap:30px;
}

/* FORM */
.contact-form{
    background:#fff;
    padding:25px;
    border-radius:12px;
    border:1px solid #e5e7eb;
}

.contact-form h5{
    margin-bottom:15px;
}

/* INPUTS */
.form-group{
    margin-bottom:15px;
}

.form-group label{
    font-size:13px;
    margin-bottom:5px;
    display:block;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #e5e7eb;
    font-size:14px;
}

.form-group input:focus,
.form-group textarea:focus{
    outline:none;
    border-color:#16a34a;
}

/* BUTTON */
.submit-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#15803d;
}

/* INFO */
.contact-info{
    background:#fff;
    padding:25px;
    border-radius:12px;
    border:1px solid #e5e7eb;
}

.contact-info h5{
    margin-bottom:15px;
}

.info-box{
    margin-bottom:15px;
}

.info-box strong{
    font-size:13px;
    display:block;
}

.info-box p{
    margin:2px 0 0;
    font-size:14px;
    color:#64748b;
}

</style>

{% endblock %}
