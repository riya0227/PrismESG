<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PrismESG</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>

    :root {
        --green: #16a34a;
        --green-light: #dcfce7;
        --green-bg: #f0fdf4;

        --text-main: #0f172a;
        --text-sub: #64748b;

        --border: #e2e8f0;
        --bg-light: #f8fafc;
    }

    /* GLOBAL */
    body {
        margin: 0;
        overflow-x: hidden;
        background: var(--bg-light);  /* ✅ NO GREEN */
        color: var(--text-main);
        font-family: system-ui, -apple-system, sans-serif;
    }

    /* NAVBAR */
    .top-navbar {
        height: 65px;
        background: #ffffff;  /* ✅ PURE WHITE */
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1050;
    }

    .navbar-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--green);
    }

    .toggle-btn {
        font-size: 20px;
        cursor: pointer;
        color: var(--text-sub);
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        height: 100vh;
        position: fixed;
        top: 65px;
        left: 0;
        background: #ffffff;
        border-right: 1px solid var(--border);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.3s;
    }

    .sidebar.collapsed {
        margin-left: -250px;
    }

    /* SIDEBAR LINKS */
    .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        color: var(--text-sub);
        text-decoration: none;
        transition: 0.2s;
    }

    /* HOVER */
    .sidebar a:hover {
        background: var(--green-bg);
        color: var(--green);
    }

    /* ACTIVE */
    .sidebar a.active {
        background: var(--green-light);
        color: var(--green);
    }

    /* MAIN CONTENT */
    .main-content {
    margin-left: 250px;
    margin-top: 65px;
    padding: 0;
    transition: 0.3s;
}

    .main-content.expanded {
        margin-left: 0;
    }

    /* PROFILE */
    .profile img {
        border-radius: 50%;
    }

    /* DROPDOWN */
    .dropdown-menu {
        border-radius: 8px;
        border: 1px solid var(--border);
    }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="top-navbar">

    <div class="d-flex align-items-center gap-3">
        <i class="bi bi-list toggle-btn" onclick="toggleSidebar()"></i>

        <!-- LOGO -->
        <span style="display:flex;align-items:center;gap:8px">
            <span style="width:8px;height:8px;background:#16a34a;border-radius:50%"></span>
            <span class="navbar-title">PrismESG</span>
        </span>
    </div>

    <!-- PROFILE -->
    <div class="dropdown profile">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle"
           href="#" role="button" data-bs-toggle="dropdown">

            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                 width="34" height="34"
                 class="me-2">

            <span style="font-size:13px;color:var(--text-main)">Riya</span>
        </a>

        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{% url 'profile' %}">Profile</a></li>
            <li><a class="dropdown-item" href="#">Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#">Logout</a></li>
        </ul>
    </div>

</div>

<!-- SIDEBAR -->
<div class="sidebar">

    <div>

        <a href="{% url 'dashboard' %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <a href="{% url 'upload_report' %}">
            <i class="bi bi-upload"></i> Upload Report
        </a>

        <a href="{% url 'report_list' %}">
            <i class="bi bi-file-earmark-text"></i> Reports
        </a>

        <a href="{% url 'analytics' %}">
            <i class="bi bi-bar-chart"></i> Analytics
        </a>

        <a href="{% url 'gap_analysis' %}">
            <i class="bi bi-exclamation-circle"></i> Gap Analysis
        </a>

        <a href="{% url 'search' %}">
            <i class="bi bi-search"></i> ESG Search
        </a>

    </div>

</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    {% block content %}
    {% endblock %}
</div>

<!-- JS -->
<script>
function toggleSidebar() {
    document.querySelector(".sidebar").classList.toggle("collapsed");
    document.querySelector(".main-content").classList.toggle("expanded");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
